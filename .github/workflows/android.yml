name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchMIDI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.1.${{ github.run_number }}"
          gh release create "$VERSION" "app/build/outputs/apk/debug/app-debug.apk#TouchMIDI-debug.apk" --title "TouchMIDI $VERSION" --notes "TouchMIDI Android alpha build. Debug signed APK for sideloading; not a Play Store release." --latest
